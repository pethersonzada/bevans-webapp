name: Assistente nativo (contratos e publicação)

on:
  pull_request:
    paths:
      - 'app/assistente/**'
      - 'app/api/assistente/**'
      - 'app/lib/assistente*.mjs'
      - 'app/lib/conhecimento-bevans.mjs'
      - 'app/components/AssistenteFlutuante.jsx'
      - 'scripts/verificar-assistente-publico.mjs'
      - 'tests/assistente*.mjs'
      - '.github/workflows/assistente-publico.yml'
  push:
    branches: [main]
    paths:
      - 'app/assistente/**'
      - 'app/api/assistente/**'
      - 'app/lib/assistente*.mjs'
      - 'app/lib/conhecimento-bevans.mjs'
      - 'app/components/AssistenteFlutuante.jsx'
      - '.github/workflows/assistente-publico.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar FAQ, mensagens e contrato do chat nativo
        run: node --test tests/assistente*.test.mjs
      - name: Verificar endpoint já publicado sem credenciais
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/verificar-assistente-publico.mjs
      - name: Publicar resultado técnico sem dados pessoais
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: disponibilidade-chat-nativo
          path: ${{ runner.temp }}/bevans-assistente-publico.json
          if-no-files-found: ignore
          retention-days: 7
