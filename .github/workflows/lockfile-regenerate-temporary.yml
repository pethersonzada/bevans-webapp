name: Temporary regenerate Next.js security lockfile

on:
  push:
    branches: [fix/nextjs-security-patches-2026-11]
    paths:
      - .github/workflows/lockfile-regenerate-temporary.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate lockfile without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.4.6 eslint-config-next@16.4.6
      - name: Output package manifest and npm lock for review
        run: |
          node -e 'const fs=require("node:fs");console.log("MANIFEST_BEGIN");process.stdout.write(fs.readFileSync("package.json","utf8"));console.log("\nMANIFEST_END");'
          node -e 'const fs=require("node:fs");console.log("LOCKFILE_BEGIN");process.stdout.write(fs.readFileSync("package-lock.json","utf8"));console.log("\nLOCKFILE_END");'
