name: Temporary security inventory

on:
  push:
    branches: [audit/issue-25-security-review]
    paths:
      - .github/workflows/audit-inventory-temporary.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare exact lockfile
        run: npm ci --ignore-scripts
      - name: npm audit, report package chains without failing inventory
        run: |
          npm audit --json --audit-level=low > /tmp/bevans-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const a=JSON.parse(fs.readFileSync("/tmp/bevans-audit.json","utf8"));
            const stats=a.metadata?.vulnerabilities||{};
            console.log("AUDIT_SUMMARY "+JSON.stringify(stats));
            for(const [name,v] of Object.entries(a.vulnerabilities||{})){
              console.log("AUDIT_ENTRY "+JSON.stringify({
                name,severity:v.severity,isDirect:v.isDirect,
                via:(v.via||[]).map(t=>typeof t==="string"?t:{name:t.name,title:t.title,url:t.url,range:t.range}),
                range:v.range,fixAvailable:v.fixAvailable,
                effects:v.effects
              }));
            }
          '
